name: 'Unity Project Settings Info'
author: Breakstep Studios
description: 'Github action that retrieves ProjectSettings info for Unity project and outputs it via github actions output.'
branding:
  icon: 'settings'
  color: 'gray-dark'
inputs:
  project-path:
    description: "Path to the Unity project root (the folder containing ProjectSettings/)"
    required: false
    default: "."
outputs:
  bundle-version:
    description: "The bundleVersion of the unity project"
    value: ${{ steps.get-project-settings.outputs.bundle-version }}
runs:
  using: "composite"
  steps:
    - name: "Get Project Settings"
      id: get-project-settings
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
      run: |
        settings_file="${PROJECT_PATH%/}/ProjectSettings/ProjectSettings.asset"
        if [ ! -f "$settings_file" ]; then
          echo "::error::ProjectSettings file not found: $settings_file"
          exit 1
        fi

        bundle_version=$(sed -n -E 's/^[[:space:]]*bundleVersion:[[:space:]]*//p' "$settings_file" | head -n 1 | tr -d '\r')
        # Strip optional surrounding quotes and trailing whitespace
        bundle_version=$(printf '%s' "$bundle_version" | sed -E "s/[[:space:]]+\$//; s/^'(.*)'\$/\1/; s/^\"(.*)\"\$/\1/")

        if [ -z "$bundle_version" ]; then
          echo "::error::Failed to find bundleVersion in $settings_file"
          exit 1
        fi

        echo "bundle_version: $bundle_version"
        echo "bundle-version=$bundle_version" >> "$GITHUB_OUTPUT"
